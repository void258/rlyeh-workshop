[project]
name = "rlyeh-workshop"
version = "0.1.0.dev0"
description = "Turn TRPG session logs into visual-novel replays and videos with your own AI agent / 让你的 AI 把跑团记录做成视觉小说 replay 和视频"
readme = "README.en.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "void258" }]
dependencies = [
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pypinyin>=0.50",
    "scipy>=1.11",
    "pillow>=10",
]

[project.optional-dependencies]
render = ["playwright>=1.50"]           # replay render：无头浏览器逐帧截图

[project.scripts]
replay = "rlyeh.cli:main"

[project.urls]
Homepage = "https://github.com/void258/rlyeh-workshop"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlyeh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
