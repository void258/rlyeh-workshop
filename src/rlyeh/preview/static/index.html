<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R'lyeh Workshop</title>
<style>
:root{--bg:#141210;--panel:#1d1a17;--line:#3a332b;--fg:#ece4d6;--mu:#9b9083;--gold:#d9a85b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a2016 0,transparent 60%),var(--bg);color:var(--fg);
font:15px/1.7 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:56px 16px}
h1{font:600 30px/1.3 "Noto Serif SC","Source Han Serif SC",serif;letter-spacing:.06em;margin:0}
p{color:var(--mu)}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;
padding:16px 18px;margin:12px 0;color:var(--fg);text-decoration:none}
a.card:hover{border-color:var(--gold)}
a.card b{font-size:18px;color:var(--gold)}
</style>
<main>
  <h1 id="title">R'lyeh Workshop</h1>
  <p id="sub"></p>
  <a class="card" href="/voices"><b data-i="voices"></b><br><span data-i="voicesD"></span></a>
  <a class="card" href="/review/voice"><b data-i="review"></b><br><span data-i="reviewD"></span></a>
</main>
<script>
const T={zh:{sub:'拉莱耶工坊 · 本地预览与审核',voices:'选声线',voicesD:'试听每个角色的候选声线，选定一段作为配音的固定参考。',
review:'逐句审听',reviewD:'连续播放配音、看识别质检结果，把不满意的句子标成重做。'},
en:{sub:"R'lyeh Workshop · local preview and review",voices:'Pick voices',voicesD:"Audition each character's voice candidates and choose one as the fixed reference.",
review:'Line review',reviewD:'Play voice lines in sequence, check speech-recognition QA, and mark lines for redo.'}};
fetch('/api/voices').then(r=>r.json()).then(d=>{
  const L=(new URLSearchParams(location.search).get('lang')||d.meta.lang||navigator.language).startsWith('en')?'en':'zh';
  document.documentElement.lang=L==='en'?'en':'zh-CN';
  document.getElementById('title').textContent=d.meta.title||"R'lyeh Workshop";
  document.getElementById('sub').textContent=T[L].sub;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[L][e.dataset.i]);
});
</script>
