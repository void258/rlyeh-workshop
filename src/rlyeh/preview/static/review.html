<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line review</title>
<style>
:root{--bg:#141210;--line:#342e27;--fg:#ece4d6;--mu:#9b9083;--gold:#d9a85b;--ok:#7fc48f;--bad:#e8866e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 "PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#141210f2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.top h1{font:600 18px/1.2 "Noto Serif SC","Source Han Serif SC",serif;margin:0;letter-spacing:.06em}
.top a{color:var(--gold);font-size:13px}
.stat{color:var(--mu);font-size:13px}.stat b{color:var(--fg)}
.btn{border:1px solid var(--line);background:#00000040;color:var(--fg);border-radius:8px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13.5px}
.btn.on{border-color:var(--gold);color:var(--gold)}
label.f{font-size:13px;color:var(--mu);cursor:pointer;user-select:none}
main{max-width:1000px;margin:0 auto;padding:12px 16px 120px}
h2{font:600 22px/1.3 "Noto Serif SC","Source Han Serif SC",serif;margin:34px 0 4px;color:var(--gold)}
h3{font:600 14px/1 system-ui,sans-serif;letter-spacing:.2em;color:var(--mu);margin:26px 0 8px;display:flex;gap:12px;align-items:center}
h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:34px 110px 1fr auto;gap:4px 10px;align-items:start;padding:6px 8px;border-radius:8px;border-left:3px solid transparent}
.ln:hover{background:#ffffff08}
.ln.cur{background:color-mix(in srgb,var(--c) 14%,transparent);border-left-color:var(--c)}
.ln.mark{box-shadow:inset 0 0 0 1px var(--bad)}
.ln .p{width:30px;height:30px;border-radius:50%;border:1px solid var(--c);background:transparent;color:var(--c);cursor:pointer;font-size:12px}
.ln .p:disabled{opacity:.25;cursor:default}
.ln .who{font-weight:600;color:var(--c);font-size:14px;padding-top:4px;overflow-wrap:anywhere;cursor:pointer}
.ln .who small{display:block;font-weight:400;color:var(--mu);font-size:11.5px}
.ln.ooc .t{color:#cfc4b3}
.ln.narration .t{font-family:"Noto Serif SC","Source Han Serif SC",serif}
.ln .t{padding-top:3px;cursor:pointer}
.tone{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px}
.side{display:flex;gap:6px;align-items:center;padding-top:3px;font-size:12px;color:var(--mu);white-space:nowrap}
.qa{border-radius:4px;padding:0 6px}.qa.ok{color:var(--ok)}.qa.bad{color:#141210;background:var(--bad)}
.heard{grid-column:3/5;font-size:12.5px;color:var(--bad)}
.note{grid-column:3/5}.note input{width:100%;background:#00000040;border:1px solid var(--bad);border-radius:6px;color:var(--fg);font:inherit;font-size:13px;padding:4px 8px}
.rd{border:1px solid var(--line);background:transparent;color:var(--mu);border-radius:6px;padding:0 8px;cursor:pointer;font:inherit;font-size:12px}
.ln.mark .rd{border-color:var(--bad);color:var(--bad)}
.pending{opacity:.5}
@media (max-width:640px){.ln{grid-template-columns:30px 1fr auto}.ln .who{grid-column:2/4}.ln .t{grid-column:2/3}.heard,.note{grid-column:2/4}}
</style>
<div class="top"><div class="in">
  <h1 id="h"></h1><a href="/" id="home"></a>
  <span class="stat" id="stat"></span>
  <button class="btn" id="playall"></button>
  <label class="f"><input type="checkbox" id="onlyBad"> <span id="lBad"></span></label>
  <label class="f"><input type="checkbox" id="hideOoc"> <span id="lOoc"></span></label>
  <span class="stat" id="saved"></span>
</div></div>
<main id="list"></main>
<script>
const T={zh:{h:'逐句审听',home:'首页',play:'▶ 从选中句连续播放',bad:'只看有问题的',ooc:'隐藏场外弹幕',ooc2:'场外',voice:'声线',
redo:'重做',marked:'已标重做',none:'未生成',heard:'识别到：',note:'想怎么改？比如：语气再凶一点 / 某个字念错了（可不填）',
stat:(d,n,m,b,k)=>`已生成 <b>${d}</b> / ${n} 句 · 共 <b>${m}</b> 分钟 · 质检不合格 <b>${b}</b> · 标记重做 <b>${k}</b>`,saved:'已保存重做标记',fail:'保存失败',bleeped:'已消音'},
en:{h:'Line review',home:'Home',play:'▶ Play from selected line',bad:'Problems only',ooc:'Hide OOC',ooc2:'OOC',voice:'voice',
redo:'Redo',marked:'Marked',none:'not generated',heard:'Heard: ',note:'What should change? e.g. angrier tone / a word is misread (optional)',
stat:(d,n,m,b,k)=>`<b>${d}</b> / ${n} lines generated · <b>${m}</b> min · <b>${b}</b> failed QA · <b>${k}</b> marked for redo`,saved:'marks saved',fail:'save failed',bleeped:'bleeped'}};
let L='zh',Lines=[],M={},cur=null,auto=false,timer=null;const audio=new Audio();const $=s=>document.querySelector(s);const rows=new Map();
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const isMarked=id=>M[id]?.status==='redo';
function render(){
  const t=T[L],list=$('#list');list.innerHTML='';rows.clear();
  const onlyBad=$('#onlyBad').checked,hideOoc=$('#hideOoc').checked;
  for(const x of Lines){
    if(x.kind==='chapter'){const h=document.createElement('h2');h.textContent=x.title;list.append(h);continue}
    if(x.kind==='scene'){const h=document.createElement('h3');h.textContent=x.title;list.append(h);continue}
    const bad=x.qa?.bad,marked=isMarked(x.id);
    if(onlyBad&&!bad&&!marked)continue;if(hideOoc&&x.kind==='ooc')continue;
    const r=document.createElement('div');r.className=`ln ${x.kind}${marked?' mark':''}${x.audio?'':' pending'}${cur===x.id?' cur':''}`;
    r.style.setProperty('--c',x.color||'#8fbcc4');
    const who=x.kind==='ooc'?`${esc(x.who)}<small>${t.ooc2} · ${esc(x.voice||'?')} ${t.voice}</small>`:esc(x.who);
    r.innerHTML=`<button class="p" ${x.audio?'':'disabled'}>▶</button><div class="who">${who}</div>
      <div class="t">${x.tone?`<span class="tone">${esc(x.tone)}</span>`:''}${esc(x.text)}</div>
      <div class="side">${x.audio?x.audio.seconds.toFixed(1)+'s'+(x.audio.bleeped?' · '+t.bleeped:''):t.none}
        ${x.qa?`<span class="qa ${bad?'bad':'ok'}" title="sim ${x.qa.sim}">${bad?'⚠ '+x.qa.sim:'✓'}</span>`:''}
        <button class="rd">${marked?t.marked:t.redo}</button></div>
      ${bad?`<div class="heard">${t.heard}${esc(x.qa.heard)}</div>`:''}
      ${marked?`<div class="note"><input placeholder="${esc(t.note)}" value="${esc(M[x.id].note||'')}"></div>`:''}`;
    r.querySelector('.p').onclick=()=>{auto=false;play(x.id)};
    r.querySelector('.who').onclick=r.querySelector('.t').onclick=()=>{cur=x.id;mark()};
    r.querySelector('.rd').onclick=()=>{M[x.id]={status:marked?'pending':'redo',note:M[x.id]?.note||''};save({[x.id]:M[x.id]});render()};
    const ni=r.querySelector('.note input');if(ni)ni.oninput=()=>{M[x.id].note=ni.value;save({[x.id]:M[x.id]})};
    rows.set(x.id,r);list.append(r);
  }
  const ls=Lines.filter(x=>x.id),done=ls.filter(x=>x.audio).length,nb=ls.filter(x=>x.qa?.bad).length;
  const sec=ls.reduce((s,x)=>s+(x.audio?.seconds||0),0),nm=ls.filter(x=>isMarked(x.id)).length;
  $('#stat').innerHTML=t.stat(done,ls.length,(sec/60).toFixed(1),nb,nm);
}
function mark(){for(const [id,r] of rows)r.classList.toggle('cur',id===cur)}
function play(id){
  const x=Lines.find(y=>y.id===id);if(!x?.audio){next();return}
  cur=id;mark();rows.get(id)?.scrollIntoView({block:'center',behavior:'smooth'});audio.src=x.audio.url;audio.play();
}
function next(){
  if(!auto)return;const ids=Lines.filter(x=>x.id&&x.audio&&rows.has(x.id)).map(x=>x.id);
  const i=ids.indexOf(cur);if(i>=0&&i+1<ids.length)setTimeout(()=>play(ids[i+1]),250);else{auto=false;$('#playall').classList.remove('on')}
}
audio.onended=next;
$('#playall').onclick=()=>{
  if(auto){auto=false;audio.pause();$('#playall').classList.remove('on');return}
  auto=true;$('#playall').classList.add('on');play(cur||Lines.find(x=>x.id&&x.audio)?.id);
};
$('#onlyBad').onchange=$('#hideOoc').onchange=render;
let pendingSave={};
function save(part){
  Object.assign(pendingSave,part);clearTimeout(timer);
  timer=setTimeout(()=>{const body=pendingSave;pendingSave={};
    fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>{$('#saved').textContent=r.ok?T[L].saved:T[L].fail}).catch(()=>{$('#saved').textContent=T[L].fail})},400);
}
async function load(first){
  const d=await (await fetch('/api/lines')).json();
  if(first){
    L=(new URLSearchParams(location.search).get('lang')||d.meta.lang||navigator.language).startsWith('en')?'en':'zh';
    document.documentElement.lang=L==='en'?'en':'zh-CN';const t=T[L];
    document.title=`${t.h} · ${d.meta.title}`;$('#h').textContent=t.h;$('#home').textContent=t.home;$('#playall').textContent=t.play;
    $('#lBad').textContent=t.bad;$('#lOoc').textContent=t.ooc;M=d.marks;
  }
  const changed=JSON.stringify(d.lines)!==JSON.stringify(Lines);Lines=d.lines;
  if(first||changed){const y=scrollY;render();scrollTo(0,y)}
}
load(true);
setInterval(()=>{if(!document.querySelector('.note input:focus'))load(false)},20000);
</script>
