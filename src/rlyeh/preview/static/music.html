<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music</title>
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
.top .in{max-width:960px}
main{max-width:960px;margin:0 auto;padding:12px 16px 120px}
section{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0}
section.picked{border-left-color:var(--ok)}
h2{font:600 19px/1.3 "Noto Serif SC","Source Han Serif SC",serif;margin:0;color:var(--gold)}
h2 small{font:400 12.5px/1 system-ui,sans-serif;color:var(--mu);margin-left:10px;letter-spacing:.02em}
.style{color:var(--mu);font-size:13px;margin:6px 0 10px;overflow-wrap:anywhere}
details{font-size:13px;color:var(--mu);margin-bottom:8px}details pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
.take{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.take audio{width:100%;height:34px}
.info{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mu)}
.chip{border:1px solid var(--line);border-radius:4px;padding:0 6px}
.chip.ok{color:var(--ok);border-color:#4d7a58}.chip.bad{color:#141210;background:var(--bad);border-color:var(--bad)}.chip.old{color:var(--gold);border-color:#6b5532}
.words{grid-column:1/3;font-size:12.5px;color:var(--bad)}
button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:3px 12px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
button.on{border-color:var(--ok);color:var(--ok);cursor:default}
.none{color:var(--mu);font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.empty{color:var(--mu);margin:40px 0}
@media (max-width:560px){.take{grid-template-columns:1fr}.words{grid-column:1}}
</style>
<div class="top"><div class="in">
  <h1 id="h"></h1><a href="/" id="home"></a>
  <span class="stat" id="stat"></span>
  <span class="stat" id="saved"></span>
</div></div>
<main id="list"></main>
<script>
const T={zh:{h:'BGM 试听',home:'首页',inst:'纯音乐',song:'带词',battle:'战斗曲',lyrics:'歌词',pick:'选这一版',picked:'已选',
none:'还没有版本：运行 replay music gen',clean:'没有人声',vocals:'唱出了词',unchecked:'没查过人声',old:'旧版（风格或歌词改过）',
seed:'种子',heard:'识别到：',empty:'还没有曲目表：在 music.yaml 里写 cues',
stat:(n,w,p)=>`共 <b>${n}</b> 段 · 有版本 <b>${w}</b> · 已选 <b>${p}</b>`,saved:'已选定',fail:'保存失败'},
en:{h:'Music',home:'Home',inst:'instrumental',song:'song',battle:'battle cue',lyrics:'Lyrics',pick:'Use this take',picked:'Chosen',
none:'No takes yet: run replay music gen',clean:'no vocals',vocals:'vocals heard',unchecked:'not checked',old:'old (style or lyrics changed)',
seed:'seed',heard:'Heard: ',empty:'No cue sheet yet: write cues in music.yaml',
stat:(n,w,p)=>`<b>${n}</b> cues · <b>${w}</b> with takes · <b>${p}</b> chosen`,saved:'chosen',fail:'save failed'}};
let L='zh',D=null;const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const t=T[L],list=$('#list');list.innerHTML='';
  if(!D.cues.length)list.innerHTML=`<p class="empty">${t.empty}</p>`;
  for(const c of D.cues){
    const s=document.createElement('section');s.className=c.takes.some(x=>x.picked)?'picked':'';
    const kind=[c.instrumental?t.inst:t.song,`${Math.round(c.seconds)}s`,c.id===D.battle?t.battle:''].filter(Boolean).join(' · ');
    s.innerHTML=`<h2>${esc(c.name)}<small>${esc(c.id)} · ${kind}</small></h2><div class="style">${esc(c.style)}</div>
      ${c.lyrics?`<details><summary>${t.lyrics}</summary><pre>${esc(c.lyrics)}</pre></details>`:''}`;
    if(!c.takes.length)s.insertAdjacentHTML('beforeend',`<div class="none">${t.none}</div>`);
    for(const x of c.takes){
      const r=document.createElement('div');r.className='take';
      const ck=!c.instrumental?'':x.check?(x.check.clean?`<span class="chip ok">✓ ${t.clean}</span>`:`<span class="chip bad">⚠ ${t.vocals}</span>`)
        :`<span class="chip">${t.unchecked}</span>`;
      r.innerHTML=`<audio controls preload="none" src="${x.url}"></audio>
        <button class="${x.picked?'on':''}">${x.picked?'✓ '+t.picked:t.pick}</button>
        <div class="info"><span>${esc(x.key)}</span>${x.seed!=null?`<span>${t.seed} ${x.seed}</span>`:''}
          ${x.seconds?`<span>${x.seconds}s</span>`:''}${ck}${x.current?'':`<span class="chip old">${t.old}</span>`}</div>
        ${x.check&&!x.check.clean?`<div class="words">${t.heard}${x.check.words.map(w=>`${w.at}s ${esc(w.text)}`).join(' · ')}</div>`:''}`;
      r.querySelector('button').onclick=()=>{if(!x.picked)pick(c.id,x.key)};
      s.append(r);
    }
    list.append(s);
  }
  $('#stat').innerHTML=t.stat(D.cues.length,D.cues.filter(c=>c.takes.length).length,D.cues.filter(c=>c.takes.some(x=>x.picked)).length);
}
document.addEventListener('play',e=>{for(const a of document.querySelectorAll('audio'))if(a!==e.target)a.pause()},true);
async function pick(id,choice){
  const r=await fetch('/api/music/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,choice})});
  $('#saved').textContent=r.ok?T[L].saved:T[L].fail;load(false,true);
}
async function load(first,force){
  const d=await (await fetch('/api/music')).json();
  if(first){
    L=(new URLSearchParams(location.search).get('lang')||d.meta.lang||navigator.language).startsWith('en')?'en':'zh';
    document.documentElement.lang=L==='en'?'en':'zh-CN';const t=T[L];
    document.title=`${t.h} · ${d.meta.title}`;$('#h').textContent=t.h;$('#home').textContent=t.home;
  }
  const changed=JSON.stringify(d)!==JSON.stringify(D);D=d;
  const playing=[...document.querySelectorAll('audio')].some(a=>!a.paused);
  if(first||force||(changed&&!playing)){const y=scrollY;render();scrollTo(0,y)}
}
load(true);
setInterval(()=>load(false),20000);
</script>
