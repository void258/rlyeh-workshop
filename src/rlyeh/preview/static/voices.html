<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voices</title>
<link rel="stylesheet" href="/static/common.css">
<script src="/static/common.js"></script>
<style>
main{max-width:1080px;margin:0 auto;padding:36px 16px 120px}
header h1{font:600 28px/1.3 var(--serif);letter-spacing:.06em;margin:0}
header p{color:var(--mu);margin:6px 0 0}
header a{color:var(--gold)}
h2.group{font:600 13px/1 system-ui,sans-serif;letter-spacing:.3em;color:var(--mu);margin:32px 0 12px;display:flex;align-items:center;gap:12px}
h2.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:4px solid var(--c);
border-radius:12px;padding:16px 18px;margin:12px 0}
.card.done{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h3{margin:0;font-size:20px;color:var(--c)}
.head .state{font-size:12.5px;color:var(--mu)}
.card.done .head .state{color:var(--ok)}
.ins{color:var(--mu);font-size:13.5px;margin:4px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.opt{background:#00000033;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#00000033)}
.row{display:flex;align-items:center;gap:10px}
.play{width:38px;height:38px;border-radius:50%;border:1px solid var(--c);background:transparent;color:var(--c);cursor:pointer;font-size:15px;flex:none}
.play.on{background:var(--c);color:#141210}
.meta{flex:1;min-width:0}.meta b{display:block;font-size:14px}.meta small{color:var(--mu)}
.pick{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:5px 0;cursor:pointer;font:inherit;font-size:13px}
.opt.sel .pick{background:var(--c);color:#141210;border-color:var(--c);font-weight:600}
.txt{font-size:13px;color:var(--mu)}
.empty{color:var(--mu);font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
background:#141210ee;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dock .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog{flex:1;min-width:160px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.saved{color:var(--mu);font-size:13px}
</style>
<main>
  <header><h1 id="title"></h1><p id="intro"></p></header>
  <div id="app"></div>
</main>
<div class="dock"><div class="in"><span id="count"></span><div class="prog"><i id="bar"></i></div><span class="saved" id="saved"></span></div></div>
<script>
const T={zh:{title:'选声线',intro:'点 ▶ 试听，点「选用」立即保存。选中的那段会作为这个角色配音时固定的音色参考。',back:'返回首页',
groups:{pc:'冒险者',narrator:'旁白',gm:'GM',npc:'其他角色'},chosen:'已选',none:'未选',fixed:'cast.yaml 里已指定参考',use:'选用',using:'已选用',
noCand:'还没有候选。运行 replay voice design 生成。',count:(a,b)=>`已选 ${a} / ${b}`,saved:'已保存',fail:'保存失败'},
en:{title:'Pick voices',intro:'Press ▶ to listen and "Use" to save right away. The chosen take becomes this character\'s fixed voice reference.',back:'Home',
groups:{pc:'Player characters',narrator:'Narrator',gm:'GM',npc:'Other characters'},chosen:'chosen',none:'not chosen',fixed:'reference set in cast.yaml',use:'Use',using:'In use',
noCand:'No candidates yet. Run replay voice design.',count:(a,b)=>`${a} / ${b} chosen`,saved:'saved',fail:'save failed'}};
let L='zh',D=null;const audio=new Audio();let playing=null;const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const app=$('#app');app.innerHTML='';const t=T[L];
  for(const kind of ['pc','narrator','gm','npc']){
    const cs=D.characters.filter(c=>(c.kind in t.groups?c.kind:'npc')===kind);if(!cs.length)continue;
    const h=document.createElement('h2');h.className='group';h.textContent=t.groups[kind];app.append(h);
    for(const c of cs){
      const card=document.createElement('div');const chosen=c.pick?.status==='approved'?c.pick.choice:null;
      card.className='card'+(chosen||c.reference?' done':'');card.style.setProperty('--c',c.color||'#d9c9a8');
      card.innerHTML=`<div class="head"><h3>${esc(c.name)}</h3><span class="state">${c.reference?t.fixed:chosen?t.chosen+'：'+esc(chosen.split('/').pop()):t.none}</span></div>
        <div class="ins">${esc(c.design)}</div><div class="opts"></div>`;
      const opts=card.querySelector('.opts');
      if(!c.candidates.length)opts.innerHTML=`<div class="empty">${t.noCand}</div>`;
      c.candidates.forEach((x,i)=>{
        const o=document.createElement('div');o.className='opt'+(chosen===x.file?' sel':'');
        o.innerHTML=`<div class="row"><button class="play">▶</button><div class="meta"><b>#${i+1}</b><small>${x.seconds.toFixed(1)}s · seed ${x.seed}</small></div></div>
          <div class="txt">${esc(x.text)}</div><button class="pick">${chosen===x.file?t.using:t.use}</button>`;
        const b=o.querySelector('.play');
        b.onclick=()=>{if(playing===b){audio.pause();b.classList.remove('on');playing=null;return}
          document.querySelectorAll('.play.on').forEach(e=>e.classList.remove('on'));audio.src=x.url;audio.play();b.classList.add('on');playing=b};
        o.querySelector('.pick').onclick=()=>save(c.id,i+1);
        opts.append(o);
      });
      app.append(card);
    }
  }
  const n=D.characters.filter(c=>c.reference||c.pick?.status==='approved').length;
  $('#count').textContent=t.count(n,D.characters.length);$('#bar').style.width=(100*n/Math.max(1,D.characters.length))+'%';
}
audio.onended=()=>{document.querySelectorAll('.play.on').forEach(e=>e.classList.remove('on'));playing=null};
async function save(id,choice){
  const r=await fetch('/api/voices/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,choice})});
  $('#saved').textContent=r.ok?T[L].saved:T[L].fail;await load();
}
async function load(){
  D=await (await fetch('/api/voices')).json();
  L=(new URLSearchParams(location.search).get('lang')||D.meta.lang||navigator.language).startsWith('en')?'en':'zh';
  document.documentElement.lang=L==='en'?'en':'zh-CN';
  document.title=`${T[L].title} · ${D.meta.title}`;$('#title').textContent=`${D.meta.title} · ${T[L].title}`;
  $('#intro').innerHTML=`${T[L].intro} <a href="/">${T[L].back}</a>`;render();
}
load();
</script>
