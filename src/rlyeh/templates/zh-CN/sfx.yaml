# 项目自己的音效，剧本里写 【音效：名字】。
# 内置的合成音效（破门、锣、幽灵、火焰……）不用写在这里，replay sfx --list 能看到全部名字。
# 人声类音效用配音后端按角色声线生成：voice 是角色 ID，tone 是语气指示，text 是要喊的内容。
# space 是声音从哪里传过来：dry 原样 · room 房间里 · next-room 门内、隔壁 · behind-door 闷在门外 · upstairs 隔着楼板
