# The project's own sound effects, used in the script as [[sfx: name]].
# Built-in synthesized sounds (door-break, gong, ghost, flames...) need no entry here; replay sfx --list shows them all.
# Vocal sounds are generated by the voice backend in a character's voice: voice is a character ID, tone the delivery,
# text what they shout.
# space is where the sound comes from: dry as is · room in the room · next-room next door · behind-door muffled
# behind a door · upstairs through the floor
